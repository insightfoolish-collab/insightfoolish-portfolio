name: Publish portfolio to Cloudflare

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the portfolio source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install project tools
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Build the portfolio
        run: pnpm run build

      - name: Publish to Cloudflare
        working-directory: dist/server
        run: ../../node_modules/.bin/wrangler deploy --config wrangler.json --name insightfoolish-portfolio
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
